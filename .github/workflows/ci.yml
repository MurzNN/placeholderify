name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install

    - name: Run linting
      run: yarn lint

    - name: Run build
      run: yarn build
